components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Dashboard ──────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required:
        - totalDepartments
        - hearingTargetDepts
        - hearingCompletedDepts
        - pendingDepts
        - totalProcesses
        - confirmedProcesses
        - totalIssues
        - totalImprovements
        - systemCandidates
        - overdueCount
        - upcomingHearings
        - processStatusBreakdown
        - improvementStatusBreakdown
        - improvementMethodBreakdown
        - issuePriorityBreakdown
        - departmentHearingProgress
      properties:
        totalDepartments:
          type: integer
        hearingTargetDepts:
          type: integer
        hearingCompletedDepts:
          type: integer
        pendingDepts:
          type: integer
        totalProcesses:
          type: integer
        confirmedProcesses:
          type: integer
        totalIssues:
          type: integer
        totalImprovements:
          type: integer
        systemCandidates:
          type: integer
        overdueCount:
          type: integer
        upcomingHearings:
          type: array
          items:
            $ref: "#/components/schemas/Hearing"
        processStatusBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        improvementStatusBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        improvementMethodBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        issuePriorityBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        departmentHearingProgress:
          type: array
          items:
            $ref: "#/components/schemas/DeptHearingProgress"

    StatusCount:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
        count:
          type: integer

    DeptHearingProgress:
      type: object
      required: [departmentId, departmentName, total, completed, inProgress, notStarted]
      properties:
        departmentId:
          type: integer
        departmentName:
          type: string
        total:
          type: integer
        completed:
          type: integer
        inProgress:
          type: integer
        notStarted:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, title, action, timestamp]
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        action:
          type: string
        timestamp:
          type: string
        departmentName:
          type: ["string", "null"]
        userName:
          type: ["string", "null"]

    # ─── Division ───────────────────────────────────────────────────────────────
    Division:
      type: object
      required: [id, name, isActive, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer
        departmentCount:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    DivisionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        sortOrder:
          type: integer

    DivisionUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer

    # ─── Department ─────────────────────────────────────────────────────────────
    Department:
      type: object
      required: [id, name, isActive, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: ["string", "null"]
        parentId:
          type: ["integer", "null"]
        divisionId:
          type: ["integer", "null"]
        divisionName:
          type: ["string", "null"]
