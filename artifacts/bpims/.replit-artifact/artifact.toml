kind = "web"
previewPath = "/"
title = "業務可視化・業務改善管理システム"
version = "1.0.0"
id = "artifacts/bpims"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23307

[services.development]
run = "pnpm --filter @workspace/bpims run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bpims", "run", "build" ]
serve = "static"
publicDir = "artifacts/bpims/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23307"
BASE_PATH = "/"
