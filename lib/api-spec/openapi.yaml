openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Business Process Improvement Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary
  - name: divisions
    description: Division (organization unit) management
  - name: departments
    description: Department management
  - name: users
    description: User management
  - name: processes
    description: Business process management
  - name: process-flows
    description: Business process flow connections
  - name: management-tasks
    description: Management task grouping of business processes
  - name: documents
    description: Document management
  - name: systems
    description: System management
  - name: hearings
    description: Hearing management
  - name: issues
    description: Issue management
  - name: improvements
    description: Improvement project management
  - name: system-candidates
    description: System candidate management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getDashboardRecentActivity
      tags: [dashboard]
      summary: Get recently updated processes and hearing activity
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── Departments ─────────────────────────────────────────────────────────────
  # ─── Divisions ────────────────────────────────────────────────────────────────
  /divisions:
    get:
      operationId: listDivisions
      tags: [divisions]
      summary: List all divisions
      parameters:
        - name: isActive
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: List of divisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Division"
    post:
      operationId: createDivision
      tags: [divisions]
      summary: Create a division
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DivisionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Division"

  /divisions/{id}:
    get:
      operationId: getDivision
      tags: [divisions]
      summary: Get a division by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Division
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Division"
        "404":
          description: Not found
    patch:
      operationId: updateDivision
      tags: [divisions]
      summary: Update a division
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DivisionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Division"
    delete:
      operationId: deleteDivision
      tags: [divisions]
      summary: Soft-delete (deactivate) a division
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List all departments
      parameters:
        - name: parentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: divisionId
          in: query
          schema:
            type: ["integer", "null"]
        - name: isActive
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    get:
      operationId: getDepartment
      tags: [departments]
      summary: Get a department by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Soft-delete (deactivate) a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /departments/tree:
    get:
      operationId: getDepartmentTree
      tags: [departments]
      summary: Get department hierarchy tree
      responses:
        "200":
          description: Department tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentTreeNode"

  # ─── Users ────────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: role
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  # ─── Processes ────────────────────────────────────────────────────────────────
  /processes:
    get:
      operationId: listProcesses
      tags: [processes]
      summary: List processes
      parameters:
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: divisionId
          in: query
          schema:
            type: ["integer", "null"]
        - name: parentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: keyword
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Process"
    post:
      operationId: createProcess
      tags: [processes]
      summary: Create a process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"

  /processes/tree:
    get:
      operationId: getProcessTree
      tags: [processes]
      summary: Get full process hierarchy tree
      parameters:
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: divisionId
          in: query
          schema:
            type: ["integer", "null"]
        - name: rootId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Process tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessTreeNode"

  /processes/{id}:
    get:
      operationId: getProcess
      tags: [processes]
      summary: Get a process by ID with full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Process detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDetail"
        "404":
          description: Not found
    patch:
      operationId: updateProcess
      tags: [processes]
      summary: Update a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
    delete:
      operationId: deleteProcess
      tags: [processes]
      summary: Soft-delete a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /processes/{id}/move:
    patch:
      operationId: moveProcess
      tags: [processes]
      summary: Move a process to a new parent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessMoveInput"
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"

  /processes/{id}/documents:
    post:
      operationId: linkProcessDocument
      tags: [processes]
      summary: Link an existing document to a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessDocumentLinkInput"
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "404":
          description: Not found

  /processes/{id}/documents/{documentId}:
    delete:
      operationId: unlinkProcessDocument
      tags: [processes]
      summary: Unlink a document from a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unlinked

  /processes/{id}/systems:
    post:
      operationId: linkProcessSystem
      tags: [processes]
      summary: Link an existing system to a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessSystemLinkInput"
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemRecord"
        "404":
          description: Not found

  /processes/{id}/systems/{systemId}:
    delete:
      operationId: unlinkProcessSystem
      tags: [processes]
      summary: Unlink a system from a process
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unlinked

  # ─── Process Flows ────────────────────────────────────────────────────────────
  /process-flows:
    get:
      operationId: listProcessFlows
      tags: [process-flows]
      summary: List process flows
      parameters:
        - name: processId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of process flows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessFlow"
    post:
      operationId: createProcessFlow
      tags: [process-flows]
      summary: Create a process flow connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessFlowInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessFlow"

  /process-flows/{id}:
    patch:
      operationId: updateProcessFlow
      tags: [process-flows]
      summary: Update a process flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessFlowUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessFlow"
    delete:
      operationId: deleteProcessFlow
      tags: [process-flows]
      summary: Delete a process flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  # ─── Management Tasks ────────────────────────────────────────────────────────
  /management-tasks:
    get:
      operationId: listManagementTasks
      tags: [management-tasks]
      summary: List all management tasks
      parameters:
        - name: isActive
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: List of management tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagementTask"
    post:
      operationId: createManagementTask
      tags: [management-tasks]
      summary: Create a management task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementTaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementTask"

  /management-tasks/{id}:
    get:
      operationId: getManagementTask
      tags: [management-tasks]
      summary: Get a management task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Management task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementTask"
        "404":
          description: Not found
    patch:
      operationId: updateManagementTask
      tags: [management-tasks]
      summary: Update a management task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementTaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementTask"
    delete:
      operationId: deleteManagementTask
      tags: [management-tasks]
      summary: Soft-delete (deactivate) a management task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  # ─── Documents ────────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      parameters:
        - name: type
          in: query
          schema:
            type: ["string", "null"]
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: keyword
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  # ─── Systems ──────────────────────────────────────────────────────────────────
  /systems:
    get:
      operationId: listSystems
      tags: [systems]
      summary: List systems
      parameters:
        - name: type
          in: query
          schema:
            type: ["string", "null"]
        - name: keyword
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemRecord"
    post:
      operationId: createSystem
      tags: [systems]
      summary: Create a system record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRecord"

  /systems/{id}:
    get:
      operationId: getSystem
      tags: [systems]
      summary: Get system by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: System
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRecord"
    patch:
      operationId: updateSystem
      tags: [systems]
      summary: Update a system
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRecord"
    delete:
      operationId: deleteSystem
      tags: [systems]
      summary: Delete a system
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  # ─── Hearings ─────────────────────────────────────────────────────────────────
  /hearings:
    get:
      operationId: listHearings
      tags: [hearings]
      summary: List hearings
      parameters:
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: processId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: fromDate
          in: query
          schema:
            type: ["string", "null"]
        - name: toDate
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of hearings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hearing"
    post:
      operationId: createHearing
      tags: [hearings]
      summary: Create a hearing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HearingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hearing"

  /hearings/board:
    get:
      operationId: getHearingBoard
      tags: [hearings]
      summary: Get hearings grouped by status for kanban board
      parameters:
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Hearings grouped by status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HearingBoard"

  /hearings/calendar:
    get:
      operationId: getHearingCalendar
      tags: [hearings]
      summary: Get hearings for calendar view
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hearings for calendar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hearing"

  /hearings/{id}:
    get:
      operationId: getHearing
      tags: [hearings]
      summary: Get a hearing by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hearing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hearing"
    patch:
      operationId: updateHearing
      tags: [hearings]
      summary: Update a hearing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
